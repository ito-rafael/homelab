        seringueira:  # xxx.xxx.xxx.181
        umbu:         # xxx.xxx.xxx.182
        canabis:      # xxx.xxx.xxx.183

    lbic_server:
      hosts:

        andira:
          ansible_host: andira.lbic.fee.unicamp.br
          ansible_user: root

        proxmox:
          ansible_host: andira.lbic.fee.unicamp.br
          ansible_user: root

        vyos:
          ansible_host: "{{ ip_vyos_router_wan }}"
          ansible_user: vyos
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: vyos.vyos.vyos
          ansible_network_cli_ssh_type: libssh
          ansible_libssh_proxy_command: 'ssh -W %h:%p -q -o StrictHostKeyChecking=no root@andira.lbic.fee.unicamp.br'

      children:
        lxc_containers:
          vars:
            ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -J root@andira.lbic.fee.unicamp.br vyos@{{ ip_vyos_router_wan }}"'
            ansible_user: root

          hosts:
            dns-1:
              ansible_host: "{{ ip_technitium_dns1 }}"
            dns-2:
              ansible_host: "{{ ip_technitium_dns2 }}"
            caddy:
              ansible_host: "{{ ip_caddy_reverseproxy }}"
            kanidm:
              ansible_host: "{{ ip_kanidm_iam }}"
            headscale:
              ansible_host: "{{ ip_headscale_vpn }}"
