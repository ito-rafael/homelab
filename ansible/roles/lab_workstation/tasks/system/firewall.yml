---
- name: system | firewall | install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: system | firewall | set default deny incoming, allow outgoing
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.dir }}"
  loop:
    - { dir: incoming, policy: deny }
    - { dir: outgoing, policy: allow }

- name: system | firewall | allow SSH from VPN (Proxmox NAT)
  community.general.ufw:
    rule: allow
    src: "143.106.45.162"
    port: "22"
    proto: tcp

- name: system | firewall | allow SSH from FEEC emergency backdoor
  community.general.ufw:
    rule: allow
    src: "ssh.fee.unicamp.br"
    port: "22"
    proto: tcp

- name: system | firewall | enable UFW and reload
  community.general.ufw:
    state: enabled
