---
- name: reload systemd user daemon
  become_user: lbic-user
  systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['lbic-user'][1] }}"

- name: reload udev rules
  shell: |
    udevadm control --reload-rules
    udevadm trigger

- name: software | openrgb | restart user systemd service
  tags: software,openrgb
  become_user: lbic-user
  ansible.builtin.systemd:
    name: openrgb
    state: restarted
    scope: user
