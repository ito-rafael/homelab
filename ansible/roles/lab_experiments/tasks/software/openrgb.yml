---
- name: software | openrgb | install packages
  tags: software,openrgb
  package:
    name:
      - openrgb                 # OpenRGB daemon and client
      - i2c-tools               # I2C/SMBus controller access
      # dependencies for OpenRGB's plugins
      - xvfb                    # virtual framebuffer X server
      - libopenal1              # [Effect] OpenAL: Open Audio library
      - libqt6core5compat6      # [Effect] Qt 6 Core 5 compatibility library
      - libgtop-2.0-11          # [Hardware Sync] GNOME top library for live CPU/RAM/GPU metric monitoring

- name: software | openrgb | create i2c group
  tags: software,openrgb
  group:
    name: i2c
    system: yes
    state: present

- name: software | openrgb | add user to i2c group
  tags: software,openrgb
  user:
    name: lbic-user
    groups: i2c
    append: yes

- name: software | openrgb | create modules-load.d config
  tags: software,openrgb
  copy:
    dest: /etc/modules-load.d/openrgb.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      i2c-dev
      {% if 'AuthenticAMD' in ansible_facts['processor'] %}
      i2c-piix4
      {% elif 'GenuineIntel' in ansible_facts['processor'] %}
      i2c-i801
      {% endif %}

- name: software | openrgb | read original udev rules
  tags: software,openrgb
  slurp:
    src: /usr/lib/udev/rules.d/60-openrgb.rules
  register: openrgb_raw_rules

- name: software | openrgb | write headless plugdev rules
  tags: software,openrgb
  copy:
    content: >
      {{ (openrgb_raw_rules['content'] | b64decode) | regex_replace('TAG\+="uaccess"', 'MODE="0660", GROUP="plugdev"') }}
    dest: /etc/udev/rules.d/61-openrgb.rules
    owner: root
    group: root
    mode: '0644'
  notify: reload udev rules

- name: software | openrgb | create plugin settings directories
  tags: software,openrgb
  file:
    path: "/home/lbic-user/.config/OpenRGB/{{ item }}"
    state: directory
    owner: lbic-user
    group: lbic-user
    mode: '0755'
  loop:
    - plugins/src
    - plugins/settings/effect-profiles
    - plugins/settings/effect-shaders
    - plugins/settings/virtual-controllers

- name: software | openrgb | download plugins
  tags: software,openrgb
  get_url:
    url: "{{ item.url }}"
    dest: "/home/lbic-user/.config/OpenRGB/plugins/src/{{ item.name }}"
    owner: lbic-user
    group: lbic-user
    mode: '0755'
  loop:
    - name: OpenRGBEffectsPlugin.so
      url: https://codeberg.org/OpenRGB/OpenRGBEffectsPlugin/releases/download/release_candidate_1.0rc2/OpenRGBEffectsPlugin_1.0rc2_Linux_amd64_415dc20.so
    - name: OpenRGBVisualMapPlugin.so
      url: https://codeberg.org/OpenRGB/OpenRGBVisualMapPlugin/releases/download/release_candidate_1.0rc2/OpenRGBVisualMapPlugin_1.0rc2_Linux_amd64_320420d.so
    - name: OpenRGBHardwareSyncPlugin.so
      url: https://codeberg.org/OpenRGB/OpenRGBHardwareSyncPlugin/releases/download/release_candidate_1.0rc2/OpenRGBHardwareSyncPlugin_1.0rc2_Linux_amd64_4aed949.so

- name: software | openrgb | deploy config files
  tags: software,openrgb
  copy:
    src: "{{ item.src }}"
    dest: "/home/lbic-user/.config/OpenRGB/{{ item.dest }}"
    owner: lbic-user
    group: lbic-user
    mode: '0644'
  loop:
    - { src: "openrgb/OpenRGB.json",                       dest: "OpenRGB.json" }
    - { src: "openrgb/profile.orp",                        dest: "profile.orp" }
    - { src: "openrgb/sizes.ors",                          dest: "sizes.ors" }
    - { src: "openrgb/visual-map/corsair-vengeance.json",  dest: "plugins/settings/virtual-controllers/corsair-vengeance" }
    - { src: "openrgb/visual-map/mobo-leds.json",          dest: "plugins/settings/virtual-controllers/mobo-leds" }
    - { src: "openrgb/effects/dna-double-helix.glsl",      dest: "plugins/settings/effect-shaders/dna-double-helix.glsl" }
    - { src: "openrgb/effects/dna-double-helix-3d.glsl",   dest: "plugins/settings/effect-shaders/dna-double-helix-3d.glsl" }
    - { src: "openrgb/effects/profile.json",               dest: "plugins/settings/effect-profiles/profile" }
    - { src: "openrgb/effects/EffectSettings.json",        dest: "plugins/settings/EffectSettings.json" }
    - { src: "openrgb/hardware-sync/MeasureSettings.json", dest: "plugins/settings/MeasureSettings.json" }
  notify:
    - reload systemd user daemon
    - software | openrgb | restart user systemd service

- name: software | openrgb | restrict SDK access to lbic-user
  tags: software,openrgb
  ansible.builtin.iptables:
    chain: OUTPUT
    action: insert
    rule_num: "1"
    out_interface: lo
    destination: 127.0.0.1/32
    protocol: tcp
    destination_port: "6742"
    uid_owner: "!lbic-user"
    jump: REJECT
    reject_with: tcp-reset
    state: present
- name: software | openrgb | create user systemd directory
  tags: software,openrgb
  file:
    path: /home/lbic-user/.config/systemd/user
    state: directory
    owner: lbic-user
    group: lbic-user
    mode: '0755'

- name: software | openrgb | copy user systemd service
  tags: software,openrgb
  copy:
    src: openrgb/openrgb.service
    dest: /home/lbic-user/.config/systemd/user/openrgb.service
    owner: lbic-user
    group: lbic-user
    mode: '0644'
  notify:
    - reload systemd user daemon
    - software | openrgb | restart user systemd service

- name: software | openrgb | enable systemd lingering
  tags: software,openrgb
  command: loginctl enable-linger lbic-user
  args:
    creates: /var/lib/systemd/linger/lbic-user

- name: software | openrgb | get uid of lbic-user
  tags: software,openrgb
  getent:
    database: passwd
    key: lbic-user

- name: software | openrgb | enable and start openrgb service
  tags: software,openrgb
  become_user: lbic-user
  systemd_service:
    name: openrgb
    scope: user
    enabled: yes
    state: started
    daemon_reload: yes
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['lbic-user'][1] }}"
