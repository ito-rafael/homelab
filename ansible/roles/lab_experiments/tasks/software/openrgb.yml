---
- name: software | openrgb | install packages
  tags: software,openrgb
  package:
    name:
      - openrgb
      - i2c-tools

- name: software | openrgb | create i2c group
  tags: software,openrgb
  group:
    name: i2c
    system: yes
    state: present

- name: software | openrgb | add user to i2c group
  tags: software,openrgb
  user:
    name: lbic-user
    groups: i2c
    append: yes

- name: software | openrgb | copy udev rules
  tags: software,openrgb
  copy:
    src: /usr/lib/udev/rules.d/60-openrgb.rules
    dest: /etc/udev/rules.d/60-openrgb.rules
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  notify: reload udev rules

- name: software | openrgb | create modules-load.d config
  tags: software,openrgb
  copy:
    dest: /etc/modules-load.d/openrgb.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      i2c-dev
      {% if 'AuthenticAMD' in ansible_facts['processor'] %}
      i2c-piix4
      {% elif 'GenuineIntel' in ansible_facts['processor'] %}
      i2c-i801
      {% endif %}

- name: software | openrgb | create plugin settings directories
  tags: software,openrgb
  file:
    path: "/home/lbic-user/.config/OpenRGB/{{ item }}"
    state: directory
    owner: lbic-user
    group: lbic-user
    mode: '0755'
  loop:
    - plugins/settings/virtual-controllers
    - plugins/settings/effect-shaders
    - profiles

- name: software | openrgb | download plugins
  tags: software,openrgb
  get_url:
    url: "{{ item.url }}"
    dest: "/home/lbic-user/.config/OpenRGB/plugins/{{ item.name }}"
    owner: lbic-user
    group: lbic-user
    mode: '0755'
  loop:
    - name: OpenRGBEffectsPlugin.so
      url: https://codeberg.org/OpenRGB/OpenRGBEffectsPlugin/releases/download/release_1.0/OpenRGBEffectsPlugin_1.0_Linux_amd64_0e0f1b4.so
    - name: OpenRGBVisualMapPlugin.so
      url: https://codeberg.org/OpenRGB/OpenRGBVisualMapPlugin/releases/download/release_1.0/OpenRGBVisualMapPlugin_1.0_Linux_amd64_1dde279.so

- name: software | openrgb | copy visual maps and effect shaders
  tags: software,openrgb
  copy:
    src: "{{ item.src }}"
    dest: "/home/lbic-user/.config/OpenRGB/{{ item.dest }}"
    owner: lbic-user
    group: lbic-user
    mode: '0644'
  loop:
    - { src: "openrgb/corsair_vengeance.json", dest: "plugins/settings/virtual-controllers/corsair_vengeance" }
    - { src: "openrgb/dna_double_helix.glsl",  dest: "plugins/settings/effect-shaders/dna_double_helix" }
    - { src: "openrgb/profile.json",           dest: "profiles/profile.json" }
  notify: reload systemd user daemon

- name: software | openrgb | create user systemd directory
  tags: software,openrgb
  file:
    path: /home/lbic-user/.config/systemd/user
    state: directory
    owner: lbic-user
    group: lbic-user
    mode: '0755'

- name: software | openrgb | copy user systemd service
  tags: software,openrgb
  copy:
    src: openrgb/openrgb.service
    dest: /home/lbic-user/.config/systemd/user/openrgb.service
    owner: lbic-user
    group: lbic-user
    mode: '0644'
  notify: reload systemd user daemon

- name: software | openrgb | enable systemd lingering
  tags: software,openrgb
  command: loginctl enable-linger lbic-user
  args:
    creates: /var/lib/systemd/linger/lbic-user

- name: software | openrgb | get uid of lbic-user
  tags: software,openrgb
  getent:
    database: passwd
    key: lbic-user

- name: software | openrgb | enable and start openrgb service
  tags: software,openrgb
  become_user: lbic-user
  systemd_service:
    name: openrgb.service
    scope: user
    enabled: yes
    state: started
    daemon_reload: yes
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['lbic-user'][1] }}"
