---
- name: software | aio cooler | install packages
  tags: software,aio
  package:
    name:
      - liquidctl

- name: software | aio cooler | setup CoolerControl repository
  tags: software,aio
  shell: "curl -1sLf 'https://dl.cloudsmith.io/public/coolercontrol/coolercontrol/setup.deb.sh' | distro=ubuntu codename={{ ansible_distribution_release }} bash"
  args:
    creates: /etc/apt/sources.list.d/coolercontrol-coolercontrol.list

- name: software | aio cooler | install CoolerControl
  tags: software,aio
  apt:
    name: coolercontrol
    state: present
    update_cache: yes

- name: software | aio cooler | enable and start coolercontrold service
  tags: software,aio
  systemd_service:
    name: coolercontrold
    enabled: yes
    state: started

- name: software | aio cooler | get latest CoolerDash release info
  tags: software,aio
  uri:
    url: https://api.github.com/repos/damachine/coolerdash/releases/latest
    return_content: yes
  register: coolerdash_release

- name: software | aio cooler | download CoolerDash package
  tags: software,aio
  get_url:
    url: "{{ (coolerdash_release.json.assets | selectattr('name', 'search', 'amd64\\.deb') | first).browser_download_url }}"
    dest: /tmp/coolerdash_latest_amd64.deb
