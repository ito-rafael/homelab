---
- name: core | kanidm setup | install repository and cryptography dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - python3-cryptography
    state: present
    update_cache: yes

- name: core | kanidm setup | download Kanidm GPG key
  ansible.builtin.get_url:
    url: https://kanidm.github.io/kanidm_ppa/kanidm_ppa.asc
    dest: /etc/apt/trusted.gpg.d/kanidm_ppa.asc
    mode: '0644'

- name: core | kanidm setup | add Kanidm APT repository (deb822 format)
  ansible.builtin.deb822_repository:
    name: kanidm
    types: deb
    architectures: amd64
    uris: https://kanidm.github.io/kanidm_ppa
    suites: "{{ ansible_facts['distribution_release'] | lower }}"
    components: stable
    signed_by: /etc/apt/trusted.gpg.d/kanidm_ppa.asc
    state: present

- name: core | kanidm setup | install Kanidm server and clients
  ansible.builtin.apt:
    name:
      - kanidm   # Kanidm Client Tools
      - kanidmd  # Kanidm Server Daemon
    state: present
    update_cache: yes

- name: core | kanidm setup | create kanidm config directory
  ansible.builtin.file:
    path: /etc/kanidm
    state: directory
    owner: root
    group: kanidmd
    mode: '0770'

- name: core | kanidm setup | generate private key for TLS
  community.crypto.openssl_privatekey:
    path: /etc/kanidm/key.pem
    owner: root
    group: kanidmd
    mode: '0640'

- name: core | kanidm setup | generate CSR for Kanidm
  community.crypto.openssl_csr:
    path: /etc/kanidm/server.csr
    privatekey_path: /etc/kanidm/key.pem
    common_name: "{{ kanidm_domain }}"
    subject_alt_name:
      - "DNS:kanidm"
      - "DNS:{{ kanidm_domain }}"
      - "IP:{{ kanidm_ip }}"

- name: core | kanidm setup | generate self-signed TLS certificate
  community.crypto.x509_certificate:
    path: /etc/kanidm/chain.pem
    privatekey_path: /etc/kanidm/key.pem
    csr_path: /etc/kanidm/server.csr
    provider: selfsigned
    owner: root
    group: kanidmd
    mode: '0640'

- name: core | kanidm setup | create kanidmd database directory
  ansible.builtin.file:
    path: /var/lib/kanidmd
    state: directory
    owner: root
    group: kanidmd
    mode: '0750'

- name: core | kanidm setup | deploy server.toml configuration
  ansible.builtin.template:
    src: server.toml.j2
    dest: /etc/kanidm/server.toml
    owner: root
    group: kanidmd
    mode: '0640'
  notify: core | kanidm setup | restart systemd service

- name: core | kanidm setup | validate server configuration
  ansible.builtin.command:
    cmd: kanidmd configtest -c /etc/kanidm/server.toml
  changed_when: false

- name: core | kanidm setup | create systemd service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/kanidmd.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: core | kanidm setup | configure systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kanidmd.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/kanidmd server -c /etc/kanidm/server.toml
  notify: core | kanidm setup | restart systemd service

- name: core | kanidm setup | enable and start kanidmd service
  ansible.builtin.systemd:
    name: kanidmd
    state: started
    enabled: yes
    daemon_reload: true

- name: core | kanidm setup | configure local CLI client
  ansible.builtin.copy:
    dest: /etc/kanidm/config
    owner: root
    group: root
    mode: '0644'
    content: |
      uri = "https://127.0.0.1:443"
      verify_ca = false
      verify_hostnames = false
