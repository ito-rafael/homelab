---
- name: core | kanidm headscale | create Headscale OIDC application
  ansible.builtin.command: >
    kanidm system oauth2 create headscale "Headscale VPN"
    {{ kanidm_headscale_oidc_callback }} --name idm_admin
  register: kanidm_oauth2_create
  changed_when:
    - kanidm_oauth2_create.rc == 0
    - "'already' not in kanidm_oauth2_create.stdout | lower"
    - "'already' not in kanidm_oauth2_create.stderr | lower"
  failed_when:
    - kanidm_oauth2_create.rc != 0
    - "'already exists' not in kanidm_oauth2_create.stderr"
    - "'409 Conflict' not in kanidm_oauth2_create.stderr"

- name: core | kanidm headscale | create headscale_users group
  ansible.builtin.command: kanidm group create headscale_users --name idm_admin
  register: kanidm_group_create
  changed_when:
    - kanidm_group_create.rc == 0
    - "'409' not in kanidm_group_create.stderr"
    - "'409' not in kanidm_group_create.stdout"
    - "'already' not in kanidm_group_create.stderr | lower"
    - "'already' not in kanidm_group_create.stdout | lower"
  failed_when:
    - kanidm_group_create.rc != 0
    - "'already exists' not in kanidm_group_create.stderr | lower"
    - "'already exists' not in kanidm_group_create.stdout | lower"
    - "'409' not in kanidm_group_create.stderr"
    - "'409' not in kanidm_group_create.stdout"

- name: core | kanidm headscale | enable POSIX on Headscale group
  ansible.builtin.command:
    cmd: kanidm group posix set headscale_users --name idm_admin
  register: kanidm_headscale_group_posix
  changed_when: true

- name: core | kanidm headscale | map openid scopes to the headscale_users group
  ansible.builtin.command: kanidm system oauth2 update-scope-map headscale headscale_users openid email profile --name idm_admin
  register: kanidm_oauth2_scope
  changed_when: false

- name: core | kanidm headscale | fetch Headscale OIDC client secret
  ansible.builtin.command: kanidm system oauth2 show-basic-secret headscale --name idm_admin
  register: kanidm_oauth2_secret
  changed_when: false

- name: core | kanidm headscale | create user accounts
  ansible.builtin.command: kanidm person create {{ item.username }} "{{ item.name }}" --name idm_admin
  loop: "{{ users }}"
  register: kanidm_user_create
  changed_when:
    - kanidm_user_create.rc == 0
    - "'already' not in kanidm_user_create.stdout | lower"
    - "'already' not in kanidm_user_create.stderr | lower"
  failed_when:
    - kanidm_user_create.rc != 0
    - "'already exists' not in kanidm_user_create.stderr"
    - "'Entry already exists' not in kanidm_user_create.stderr"
    - "'409 Conflict' not in kanidm_user_create.stderr"

- name: core | kanidm headscale | generate setup token for new users
  ansible.builtin.command: kanidm person credential create-reset-token {{ item.item.username }} --name idm_admin
  loop: "{{ kanidm_user_create.results }}"
  when: item.changed
  register: kanidm_setup_tokens
  changed_when: true

- name: core | headscale onboarding | download latest cheatsheet PDF from GitHub
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/ito-rafael/ansible-provision/main/roles/lab_experiments/cheatsheet/cheatsheet.pdf"
    dest: "/tmp/cheatsheet.pdf"
    mode: '0644'

- name: core | kanidm headscale | send email instructions to new users
  community.general.mail:
    host: smtp.gmail.com
    port: 587
    username: "{{ vault_smtp_user }}"
    password: "{{ vault_smtp_password }}"
    from: "LBiC Cluster Admin <{{ vault_smtp_user }}>"
    to: "{{ item.item.item.name }} <{{ item.item.item.email }}>"
    #cc:
    #  - "Fernando Von Zuben <{{ vault_professor_email }}>"
    #  - "Rafael Ito <{{ vault_admin_email }}>"
    subject: "Acesso ao Cluster do LBIC (Conta e VPN)"
    subtype: html
    body: |
      Olá {{ item.item.item.name.split(' ')[0] }},<br><br>

      Sua conta para acessar os computadores do LBiC foi criada.<br><br>

      <b>1. Configuração da Senha</b><br>
      O laboratório utiliza um sistema unificado de credenciais. Para definir sua senha pessoal, acesse a página abaixo:<br>
      🔗 <a href="https://andira.lbic.fee.unicamp.br/ui/reset">https://andira.lbic.fee.unicamp.br/ui/reset</a><br>
      👤 <b>Usuário:</b> {{ item.item.item.username }}<br>
      🔑 <b>Token de configuração:</b> <pre>{{ item.stdout | trim }}</pre><br>
      <i>Atenção: este token expira em 24 horas.</i><br><br>

      <b>2. Acesso à VPN (Tailscale)</b><br>
      Após criar a sua senha, você poderá acessar a rede de qualquer lugar. Instale o <a href="https://tailscale.com/download">Tailscale</a> em seu computador e execute o comando abaixo no terminal:<br>
      <pre>sudo tailscale up --login-server https://andira.lbic.fee.unicamp.br:8443 --accept-routes</pre><br>
      Isso abrirá uma janela no seu navegador solicitando o seu usuário ({{ item.item.item.username }}) e a senha que você acabou de criar.<br><br>

      Aproveito para enviar em anexo um guia rápido sobre a utilização dos recursos computacionais do laboratório.<br><br>

      Qualquer dúvida, fico à disposição.<br><br>

      Atenciosamente,<br><br>
      Rafael Ito
    attach:
      - "/tmp/cheatsheet.pdf"
  loop: "{{ kanidm_setup_tokens.results }}"
  # send the email only to accounts that actually had a new token generated in the previous task
  when: item.changed
  # report "changed" when the email is actually dispatched
  changed_when: true

- name: core | kanidm headscale | inspect POSIX attributes for users
  ansible.builtin.command: kanidm person posix show --name idm_admin {{ item.username }}
  loop: "{{ users }}"
  register: kanidm_posix_state
  changed_when: false
  failed_when: false
