---

- name: core | headscale onboarding | create user namespaces in Headscale
  ansible.builtin.command: "headscale users create {{ item.username }}"
  loop: "{{ users }}"
  register: user_creation
  failed_when:
    - user_creation.rc != 0
    - "'UNIQUE constraint failed' not in user_creation.stderr"
    - "'already exists' not in user_creation.stderr" # kept for backwards compatibility
  changed_when: user_creation.rc == 0

- name: core | headscale onboarding | fetch registered devices
  ansible.builtin.command: "headscale nodes list --output json"
  register: all_nodes
  changed_when: false

- name: core | headscale onboarding | fetch registered users to get IDs
  ansible.builtin.command: "headscale users list --output json"
  register: registered_users
  changed_when: false

- name: core | headscale onboarding | fetch all existing pre-auth keys
  ansible.builtin.command: "headscale preauthkeys list --output json"
  register: all_keys
  changed_when: false

- name: core | headscale onboarding | generate pre-auth keys for users without active keys
  ansible.builtin.command: "headscale preauthkeys create --user {{ (registered_users.stdout | from_json | selectattr('name', 'equalto', item.username) | first).id }} --expiration 24h"
  loop: "{{ users }}"
  when:
    # check 1: user has no registered devices
    - (all_nodes.stdout | default('[]', true) | from_json | selectattr('user.name', 'equalto', item.username) | list | length) == 0
    # check 2: user has no unused pre-auth keys (defaults to false if the 'used' JSON key is omitted)
    - (all_keys.stdout | default('[]', true) | from_json | selectattr('user.name', 'equalto', item.username) | map(attribute='used', default=false) | reject | list | length) == 0
  register: generated_keys

- name: core | headscale onboarding | download latest cheatsheet PDF from GitHub
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/ito-rafael/ansible-provision/main/roles/lab_experiments/cheatsheet/cheatsheet.pdf"
    dest: "/tmp/cheatsheet.pdf"
    mode: '0644'

- name: core | headscale onboarding | send email instructions to new users
  community.general.mail:
    host: smtp.gmail.com
    port: 587
    username: "{{ vault_smtp_user }}"
    password: "{{ vault_smtp_password }}"
    from: "LBiC Cluster Admin <{{ vault_smtp_user }}>"
    to: "{{ item.item.name }} <{{ item.item.email }}>"
    cc: "Fernando Von Zuben <{{ vault_professor_email }}>"
    subject: "Acesso ao cluster do LBIC (VPN)"
    subtype: html
    body: |
      <p>Olá {{ item.item.name.split(' ')[0] }},</p>

      <p>Sua conta para acessar os computadores do LBiC foi criada.<br>
      Para utilizar a VPN do laboratório, instale o <a href="https://tailscale.com/download">Tailscale</a> em seu computador e execute o comando abaixo no terminal:</p>

      <div style="background-color: #f4f4f4; border: 1px solid #ccc; border-radius: 4px; padding: 12px; font-family: monospace; margin: 15px 0; word-wrap: break-word;">
        sudo tailscale up --login-server https://andira.lbic.fee.unicamp.br --accept-routes --authkey {{ item.stdout | trim }}
      </div>

      <p><b>Atenção:</b> esta chave expira em 24 horas.</p>

      <p>Aproveito para enviar em anexo um guia rápido sobre a utilização dos recursos computacionais do laboratório.<br>
      Qualquer dúvida, fico à disposição.</p>

      <p>Atenciosamente,<br>
      Rafael Ito</p>
    attach:
      - "/tmp/cheatsheet.pdf"
  loop: "{{ generated_keys.results }}"
  # send the email only to accounts that actually had a new key generated in the previous task
  when: item.changed
  # report "changed" when the email is actually dispatched
  changed_when: true
