---
- name: ops | kanidm users | authenticate CLI as idm_admin
  ansible.builtin.shell: "KANIDM_PASSWORD=$(cat /root/kanidm_idm_admin_password.txt) kanidm login --name idm_admin"
  changed_when: false
  no_log: true

- name: ops | users | initialize empty processed_users list
  ansible.builtin.set_fact:
    processed_users: []

- name: ops | users | pre-process user list with computed attributes
  ansible.builtin.set_fact:
    processed_users: >-
      {{
        processed_users + [
          item | combine({
            'username': item.username | default((item.name.split(' ')[0] ~ '.' ~ item.name.split(' ')[-1]) | lower)
          }) | combine(
            { 'expire_timestamp': ((item.enroll | default('0000-00-00')).split('-')[0] | int + duration_map[item.level]) | string ~ '-' ~ (item.enroll | default('0000-00-00')).split('-')[1] ~ '-' ~ (item.enroll | default('0000-00-00')).split('-')[2] ~ 'T00:00:00Z' }
            if item.level != 'admin' else {}
          )
        ]
      }}
  loop: "{{ users }}"
  vars:
    duration_map:
      phd: 5
      masters: 3
      undergraduation: 1
      associate: 1
      admin: 0

- name: ops | users | create user accounts
  ansible.builtin.command: kanidm person create {{ item.username }} "{{ item.name }}" --name idm_admin
  loop: "{{ processed_users }}"
  register: kanidm_user_create
  changed_when:
    - kanidm_user_create.rc == 0
    - "'already' not in kanidm_user_create.stdout | lower"
    - "'already' not in kanidm_user_create.stderr | lower"
  failed_when:
    - kanidm_user_create.rc != 0
    - "'already exists' not in kanidm_user_create.stderr"
    - "'Entry already exists' not in kanidm_user_create.stderr"
    - "'409 Conflict' not in kanidm_user_create.stderr"
  loop_control:
    label: "{{ item.username }}"

- name: ops | users | generate setup token for new users
  ansible.builtin.command: kanidm person credential create-reset-token {{ item.item.username }} --name idm_admin
  loop: "{{ kanidm_user_create.results | selectattr('changed') | list }}"
  register: kanidm_setup_tokens
  changed_when: true
  loop_control:
    label: "{{ item.item.username }}"

- name: ops | users | get current user details
  ansible.builtin.command: >
    kanidm person get {{ item.username }} --output json --name idm_admin
  loop: "{{ processed_users }}"
  register: kanidm_users_current
  changed_when: false
  loop_control:
    label: "{{ item.username }}"

- name: ops | users | set users legal name and mail address
  ansible.builtin.command: >
    kanidm person update {{ item.item.username }}
    {% if item.item.name is defined %}--legalname "{{ item.item.name }}"{% endif %}
    {% if item.item.email is defined %}--mail "{{ item.item.email }}"{% endif %}
    --name idm_admin
  loop: "{{ kanidm_users_current.results }}"
  vars:
    # parse Kanidm output (adjust key paths based on your Kanidm version's JSON structure)
    current_json: "{{ item.stdout | from_json }}"
    current_legalname: "{{ current_json.attrs.legalname[0] | default('') }}"
    current_mail: "{{ current_json.attrs.mail[0] | default('') }}"

    desired_name: "{{ item.item.name | default(current_legalname) }}"
    desired_email: "{{ item.item.email | default(current_mail) }}"
  when: >
    (item.item.name is defined and desired_name != current_legalname) or
    (item.item.email is defined and desired_email != current_mail)
  loop_control:
    label: "{{ item.item.username }}"

- name: core | headscale onboarding | download latest cheatsheet PDF from GitHub
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/ito-rafael/homelab/main/docs/cheatsheet/cheatsheet.pdf"
    dest: "/tmp/cheatsheet.pdf"
    mode: '0644'

- name: ops | users | send email instructions to new users
  community.general.mail:
    host: smtp.gmail.com
    port: 587
    username: "{{ vault_smtp_user }}"
    password: "{{ vault_smtp_password }}"
    from: "LBiC Admin <{{ vault_smtp_user }}>"
    to: "{{ item.item.item.name }} <{{ item.item.item.email }}>"
    #cc:
    #  - "{{ vault_professor_name }} <{{ vault_professor_email }}>"
    #  - "{{ vault_admin_name }} <{{ vault_admin_email }}>"
    subject: "Acesso ao Cluster do LBIC (Conta e VPN)"
    subtype: html
    body: |
      <p>Olá {{ item.item.item.name.split(' ')[0] }},</p>

      <p>Sua conta para acessar os computadores do LBiC foi criada.</p>

      <ul>
        <li>
          <strong>Configuração da Senha</strong><br>
          O laboratório utiliza um sistema unificado de credenciais. Para definir sua senha pessoal ou cadastrar uma Passkey, clique no link seguro abaixo:<br><br>
          {% set parsed_token = item.stdout | regex_search('(?<=token=)[a-z0-9\-]+') %}
          <a href="https://andira.lbic.fee.unicamp.br/ui/reset?token={{ parsed_token }}"><b>Configurar Minha Conta LBiC</b></a><br><br>
          <p>Se por algum motivo o redirecionamento não funcionar, você pode usar as seguintes credenciais para criar sua conta:</p>

          <b>Link:</b> <a href="https://andira.lbic.fee.unicamp.br/ui/reset">https://andira.lbic.fee.unicamp.br/ui/reset</a><br>
          <b>Usuário:</b> {{ item.item.item.username }}<br>
          <b>Token de uso único:</b> <code>{{ parsed_token }}</code><br>
          <i>Atenção: este link de acesso expira em 24 horas.</i><br><br>
        </li>
        <li>
          <strong>Acesso à VPN (Tailscale)</strong><br>
          Após criar a sua senha, você poderá acessar a rede do laboratório de qualquer lugar. Instale o Tailscale em seu computador e execute o comando abaixo no terminal:<br><br>
          <code>sudo tailscale up --login-server https://andira.lbic.fee.unicamp.br --accept-routes</code><br><br>
          Isso abrirá uma janela no seu navegador solicitando o seu usuário ({{ item.item.item.username }}) e a senha que você acabou de criar.
        </li>
      </ul>

      <p>Aproveito para enviar em anexo um guia rápido sobre a utilização dos recursos computacionais do laboratório.</p>

      <p>Qualquer dúvida, fico à disposição.</p>
      <p>Atenciosamente,<br>{{ vault_admin_name }}</p>
    attach:
      - "/tmp/cheatsheet.pdf"
  loop: "{{ kanidm_setup_tokens.results }}"
  # send the email only to accounts that actually had a new token generated in the previous task
  when: item.changed
  # report "changed" when the email is actually dispatched
  changed_when: true

- name: ops | users | inspect POSIX attributes for users
  ansible.builtin.command: kanidm person posix show --name idm_admin {{ item.username }}
  loop: "{{ processed_users }}"
  register: kanidm_posix_state
  changed_when: false
  failed_when: false

- name: ops | users | give the student POSIX attributes (bash shell)
  ansible.builtin.command: kanidm person posix set {{ item.username }} --shell /bin/bash --name idm_admin
  loop: "{{ processed_users }}"
  loop_control:
    index_var: kanidm_user_index
  when: >-
    kanidm_posix_state.results[kanidm_user_index].rc != 0 or
    'shell: /bin/bash' not in kanidm_posix_state.results[kanidm_user_index].stdout
  register: kanidm_posix
  changed_when: kanidm_posix.rc == 0

- name: ops | users | inspect Headscale VPN group membership
  ansible.builtin.command: kanidm person get {{ item.username }} --name idm_admin
  loop: "{{ processed_users }}"
  register: kanidm_person_state
  changed_when: false

- name: ops | users | add users to Headscale VPN group
  ansible.builtin.command: kanidm group add-members headscale_users {{ item.username }} --name idm_admin
  loop: "{{ processed_users }}"
  loop_control:
    index_var: kanidm_user_index
  when:
    - "'memberof: headscale_users@' not in kanidm_person_state.results[kanidm_user_index].stdout"
  register: kanidm_group_add
  changed_when: kanidm_group_add.rc == 0
