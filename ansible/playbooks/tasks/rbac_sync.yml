---
- name: ops | workstations | authenticate CLI as idm_admin
  ansible.builtin.shell: "KANIDM_PASSWORD=$(cat /root/kanidm_idm_admin_password.txt) kanidm login --name idm_admin"
  changed_when: false
  no_log: true

- name: ops | workstations | get workstation users group state
  ansible.builtin.command: "kanidm group get {{ item.hostname }}_users --name idm_admin -o json"
  loop: "{{ workstations }}"
  register: ws_users_state
  changed_when: false
  failed_when: false

- name: ops | workstations | create workstation users group
  ansible.builtin.command: "kanidm group create {{ item.hostname }}_users --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_users_state.results[idx] }}"
  # run if group doesn't exist yet
  when: "'No matching group' in state.stdout or 'not found' in state.stderr"

- name: ops | workstations | enable POSIX on workstation users group
  ansible.builtin.command: "kanidm group posix set {{ item.hostname }}_users --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_users_state.results[idx] }}"
    is_missing: "{{ 'No matching group' in state.stdout or 'not found' in state.stderr }}"
    group_attrs: "{{ (state.stdout | from_json).attrs if not is_missing else {} }}"
    classes: "{{ group_attrs.class | default([]) }}"
  # run if group was just created or POSIX is unset
  when: >
    is_missing or
    'posixgroup' not in classes or
    group_attrs.gidnumber is not defined

- name: ops | workstations | set exact members for workstation users
  ansible.builtin.command: "kanidm group set-members {{ item.hostname }}_users {{ item.users_allowed | join(' ') }} --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_users_state.results[idx] }}"
    is_missing: "{{ 'No matching group' in state.stdout or 'not found' in state.stderr }}"
    group_attrs: "{{ (state.stdout | from_json).attrs if not is_missing else {} }}"
    current_members: "{{ group_attrs.member | default([]) }}"
    expected_members: "{{ item.users_allowed | map('regex_replace', '^(.*)$', '\\1@' ~ kanidm_domain) | list }}"
  # run if group was just created, or if members list needs update
  # guardrail: run set-members only if there is at least one user to add
  when:
    - item.users_allowed is defined
    - item.users_allowed | length > 0
    - is_missing or (expected_members | sort != current_members | sort)

- name: ops | workstations | purge members when users_allowed is empty
  ansible.builtin.command: "kanidm group purge-members {{ item.hostname }}_users --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_users_state.results[idx] }}"
    is_missing: "{{ 'No matching group' in state.stdout or 'not found' in state.stderr }}"
    group_attrs: "{{ (state.stdout | from_json).attrs if not is_missing else {} }}"
    current_members: "{{ group_attrs.member | default([]) }}"
  when:
    - not is_missing
    - item.users_allowed is defined and item.users_allowed | length == 0
    - current_members | length > 0

- name: ops | workstations | get workstation admins group state
  ansible.builtin.command: "kanidm group get {{ item.hostname }}_admins --name idm_admin -o json"
  loop: "{{ workstations }}"
  register: ws_admins_state
  changed_when: false
  failed_when: false

- name: ops | workstations | create workstation admins group
  ansible.builtin.command: "kanidm group create {{ item.hostname }}_admins --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_admins_state.results[idx] }}"
  # run if group doesn't exist yet
  when: "'No matching group' in state.stdout or 'not found' in state.stderr"

- name: ops | workstations | enable POSIX on workstation admins group
  ansible.builtin.command: "kanidm group posix set {{ item.hostname }}_admins --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_admins_state.results[idx] }}"
    is_missing: "{{ 'No matching group' in state.stdout or 'not found' in state.stderr }}"
    group_attrs: "{{ (state.stdout | from_json).attrs if not is_missing else {} }}"
    classes: "{{ group_attrs.class | default([]) }}"
  # run if group was just created or POSIX is unset
  when: >
    is_missing or
    'posixgroup' not in classes or
    group_attrs.gidnumber is not defined

- name: ops | workstations | set exact members for workstation admins
  ansible.builtin.command: "kanidm group set-members {{ item.hostname }}_admins {{ item.admin | join(' ') }} --name idm_admin"
  loop: "{{ workstations }}"
  loop_control:
    index_var: idx
  vars:
    state: "{{ ws_admins_state.results[idx] }}"
    is_missing: "{{ 'No matching group' in state.stdout or 'not found' in state.stderr }}"
    group_attrs: "{{ (state.stdout | from_json).attrs if not is_missing else {} }}"
    current_members: "{{ group_attrs.member | default([]) }}"
    expected_members: "{{ item.admin | map('regex_replace', '^(.*)$', '\\1@' ~ kanidm_domain) | list }}"
  # run if group was just created, or if members list needs update
  # guardrail: run set-members only if there is at least one admin to add
  when:
    - item.admin is defined
    - item.admin | length > 0
    - is_missing or (expected_members | sort != current_members | sort)
